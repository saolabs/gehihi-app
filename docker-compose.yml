# PostgreSQL cho môi trường dev/test. Cổng host mặc định 5433 để không đụng Postgres của dự án khác.
services:
  postgres:
    image: postgres:16-alpine
    container_name: gehihi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gehihi}
      POSTGRES_USER: ${DB_USERNAME:-gehihi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Đặt DB_PASSWORD trong .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - gehihi-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gehihi-postgres:
